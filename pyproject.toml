[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hitprint"
version = "0.1.0"
description = "Find the fingerprint of your hits: what your best short videos have in common."
license = {text = "MIT"}
requires-python = ">=3.11"

[project.scripts]
hitprint = "hitprint.cli:main"

[tool.setuptools]
packages = ["hitprint"]

[tool.setuptools.package-data]
hitprint = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
