<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitprint report</title>
<style>
  :root { --bg:#0b0c10; --panel:#14161d; --panel2:#1a1d26; --line:#252937; --text:#eceef4; --muted:#9aa1b2;
          --accent:#7cf0b4; --accent-dim:rgba(124,240,180,.12); --warn:#ffb86b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing:antialiased; }
  main { max-width:1100px; margin:0 auto; padding:48px 16px 56px; }
  header { padding:0 4px 8px; }
  header .kicker { margin:0 0 6px; color:var(--accent); font-size:12px; font-weight:700;
                   letter-spacing:.14em; text-transform:uppercase; }
  header h1 { margin:0; font-size:44px; line-height:1.05; letter-spacing:-1px; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); margin:8px 0 0; overflow-wrap:anywhere; }
  header .proof { display:inline-block; margin-top:14px; padding:4px 10px; font-size:13px;
                  border:1px solid var(--line); border-radius:999px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px 28px; margin-top:20px; }
  h2 { margin:0 0 16px; font-size:20px; letter-spacing:-.2px; }
  h3 { margin:0 0 12px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  ol, ul { margin:0; padding-left:22px; }
  li { margin:8px 0; }
  .muted { color:var(--muted); }
  ol.rules { list-style:none; padding:0; display:grid; gap:10px; }
  ol.rules li { display:flex; align-items:center; gap:16px; margin:0; padding:12px 16px;
                background:var(--panel2); border:1px solid var(--line); border-radius:12px; }
  .ratio { flex:none; min-width:72px; text-align:center; padding:6px 10px; border-radius:10px;
           background:var(--accent-dim); color:var(--accent); font-size:22px; font-variant-numeric:tabular-nums; }
  .fixes { border-color:rgba(124,240,180,.35); background:linear-gradient(180deg, var(--accent-dim), var(--panel) 70%); }
  .fixes li::marker { color:var(--accent); font-weight:700; }
  .strip { display:flex; gap:14px; align-items:center; margin:0 0 14px; }
  .frames { display:flex; gap:4px; flex:none; }
  .frames img { height:96px; border-radius:6px; display:block; }
  .strip .cap { min-width:0; font-size:13px; color:var(--muted); }
  .strip .cap b { display:block; margin-top:4px; color:var(--text); font-size:15px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:24px; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:right; }
  th:first-child, td:first-child { text-align:left; white-space:normal; min-width:260px; }
  th { color:var(--muted); font-weight:600; font-size:12px; background:var(--panel2); position:sticky; top:0; }
  tr:last-child td { border-bottom:0; }
  tr:hover td { background:var(--panel2); }
  .err { color:var(--warn); }
  footer { color:var(--muted); text-align:center; margin-top:32px; font-size:13px; }
  @media (max-width:600px) {
    header h1 { font-size:34px; }
    section { padding:18px 16px; }
    .strip { flex-direction:column; align-items:flex-start; }
    ol.rules li { gap:12px; }
  }
</style>
</head>
<body>
<main>
{{body}}
</main>
</body>
</html>
