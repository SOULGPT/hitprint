<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitprint report</title>
<style>
  :root { --bg:#0e0f13; --panel:#171920; --line:#262a35; --text:#e8eaf0; --muted:#9aa1b2; --accent:#7cf0b4; --warn:#ffb86b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px 48px; }
  header h1 { margin:0; font-size:32px; letter-spacing:-0.5px; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); margin:4px 0 0; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px 24px; margin-top:20px; }
  h2 { margin:0 0 12px; font-size:20px; }
  ol, ul { margin:0; padding-left:22px; }
  li { margin:6px 0; }
  .muted { color:var(--muted); }
  .strip { display:flex; gap:4px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .strip img { height:96px; border-radius:4px; }
  .strip .cap { margin-left:8px; font-size:13px; color:var(--muted); max-width:320px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  .err { color:var(--warn); }
  footer { color:var(--muted); text-align:center; margin-top:24px; font-size:13px; }
</style>
</head>
<body>
<main>
{{body}}
</main>
</body>
</html>
